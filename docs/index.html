<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Majors Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a hand-lettered course scoreboard. Tabs across the top, the four
   players' standings as a board, then each player's twelve golfers. */
:root {
  --bg: #f3f4ef;
  --board: #ffffff;
  --ink: #1d231f;
  --muted: #69716b;
  --rule: #d9ddd5;
  --green: #1f5a3c;        /* scoreboard green: tabs, header */
  --green-ink: #f4f7f2;
  --win: #1f5a3c;          /* green used for text */
  --under: #c22a24;        /* under par is red, as on a course board */
  --live: #c22a24;
  --flag: #a86a00;
  --flag-bg: #fbf1dc;
  --soft: #eef1ea;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121613; --board: #1a201c; --ink: #e8ece6; --muted: #99a29b; --rule: #2d3530;
    --green: #2c6e4b; --green-ink: #f4f7f2; --win: #74c597; --under: #ff6b5e; --live: #ff6b5e;
    --flag: #f0b545; --flag-bg: #2e2715; --soft: #222a25; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121613; --board: #1a201c; --ink: #e8ece6; --muted: #99a29b; --rule: #2d3530;
  --green: #2c6e4b; --green-ink: #f4f7f2; --win: #74c597; --under: #ff6b5e; --live: #ff6b5e;
  --flag: #f0b545; --flag-bg: #2e2715; --soft: #222a25; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: var(--green); color: var(--green-ink); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 18px 0; }
h1 { font: 700 30px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.year { font: 600 15px var(--display); letter-spacing: .08em; opacity: .85; }
.year select { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; padding: 1px 4px; }
.year select option { color: #1d231f; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
nav.tabs a { font: 600 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; padding: 11px 14px 12px; border-radius: 6px 6px 0 0; color: var(--green-ink); opacity: .78; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
nav.tabs a:hover { opacity: 1; }
nav.tabs a[aria-current="page"] { background: var(--bg); color: var(--ink); opacity: 1; }
nav.tabs a:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 var(--live); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

main.wrap { padding-block: 22px 48px; display: grid; gap: 28px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.head h2 { font: 700 34px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.pill { font: 600 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 4px; background: var(--soft); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.pill.live { background: color-mix(in srgb, var(--live) 14%, transparent); color: var(--live); }
.pill.final { background: var(--ink); color: var(--bg); }
.meta { color: var(--muted); font-size: 13px; }
.banner { background: var(--flag-bg); color: var(--ink); border-left: 3px solid var(--flag); padding: 10px 14px; border-radius: 4px; font-size: 14px; }

h3 { font: 600 15px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

/* The board: four places */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--board); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.place { padding: 14px 16px 16px; border-right: 1px solid var(--rule); display: grid; gap: 2px; min-width: 0; }
.place:last-child { border-right: 0; }
.place .rk { font: 700 15px/1 var(--display); letter-spacing: .1em; color: var(--muted); }
.place.first .rk { color: var(--win); }
.place .who { font: 600 22px/1.15 var(--display); letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }
.place .tot { font: 700 46px/1 var(--display); margin-top: 2px; }
.place .sub { color: var(--muted); font-size: 13px; }
.under { color: var(--under); }

/* Teams */
.teams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.team { background: var(--board); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
.team h4 { margin: 0; padding: 11px 14px; border-bottom: 1px solid var(--rule); font: 600 18px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.team h4 span { font-size: 15px; color: var(--muted); letter-spacing: .08em; }
.team ol { list-style: none; margin: 0; padding: 4px 0; }
.team li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 52px; gap: 6px; align-items: baseline; padding: 5px 14px; font-size: 14px; }
.team li.gap { margin-top: 6px; border-top: 1px dashed var(--rule); padding-top: 9px; }
.team li .mark { color: var(--win); font-weight: 700; font-size: 11px; }
.team li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team li.counts .nm { font-weight: 600; }
.team li .sc { font: 600 17px/1 var(--display); text-align: right; }
.team li .st { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.team li.out .nm, .team li.out .sc { color: var(--muted); }
.team li.out .nm { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.team li.out .sc { font-size: 14px; letter-spacing: .06em; }
.legend { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* Day files */
.days { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: grid; gap: 2px; min-width: 150px; flex: 1 1 150px; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--board); text-decoration: none; }
.chip b { font: 600 18px/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.chip small { color: var(--muted); font-size: 12px; }
a.chip:hover { border-color: var(--win); }
a.chip b::after { content: " ↓"; color: var(--win); }
.chip.pending { border-style: dashed; background: transparent; color: var(--muted); }

/* Name check */
.checks { display: grid; gap: 6px; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: baseline; padding: 9px 14px; border-radius: 6px; background: var(--board); border: 1px solid var(--rule); font-size: 14px; }
.check .tag { font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; background: var(--soft); color: var(--muted); }
.check.likely .tag, .check.dnp .tag { background: var(--flag-bg); color: var(--flag); }

/* Overall */
.tablewrap { overflow-x: auto; background: var(--board); border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { padding: 11px 14px; text-align: center; border-bottom: 1px solid var(--rule); }
th { font: 600 14px/1.1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td.who, th.who { text-align: left; }
td.who { font: 600 20px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
td.n { font: 600 22px/1 var(--display); }
td.total { font: 700 26px/1 var(--display); }
td .lv { font-style: italic; color: var(--live); }
tr:last-child td { border-bottom: 0; }
.place-col { color: var(--win); font: 700 22px/1 var(--display); }
.note { color: var(--muted); font-size: 13px; max-width: 65ch; }
.empty { background: var(--board); border: 1px dashed var(--rule); border-radius: 8px; padding: 28px 20px; color: var(--muted); max-width: 640px; }
.empty b { color: var(--ink); }

@media (max-width: 920px) {
  .teams { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .place:nth-child(2) { border-right: 0; }
  .place:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
  .place .tot { font-size: 38px; }
  .teams { grid-template-columns: minmax(0, 1fr); }
  .head h2 { font-size: 28px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Majors Pool</h1>
    <div class="year" id="year"></div>
    <nav class="tabs" id="tabs" aria-label="Majors"></nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="empty">Loading standings…</div>
</main>

<script>
const REFRESH_MS = 5 * 60 * 1000;
const state = { years: [], year: null, data: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SHORT = { masters: "Masters", pga: "PGA", usopen: "US Open", open: "The Open" };
const tabLabel = (m) => m.test ? "Test · " + m.name.replace(/\s+(Championship|Tournament|Classic)$/i, "") : (SHORT[m.key] || m.name);

function scoreNum(s) { return s === "E" ? 0 : Number(s); }
function isUnder(score) { return typeof score === "string" && score.startsWith("-"); }
function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
}
function day(isoDate) {
  if (!isoDate) return "";
  const [y, m, d] = isoDate.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function statusText(g) {
  if (g.out) return "";
  const s = g.status || "";
  if (/^\d+$/.test(s)) return "Thru " + s;
  if (/[AP]M$/i.test(s)) return s.replace(/\s+/, " ");
  return s;
}

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  try {
    const idx = await getJSON("data/index.json");
    state.years = idx.years || [];
    if (!state.year || !state.years.includes(state.year)) state.year = state.years[0];
    state.data = state.year ? await getJSON(`data/${state.year}.json`) : null;
  } catch (e) {
    if (!state.data) {
      $("#main").innerHTML = `<div class="empty"><b>No standings yet.</b> The page fills in the first time the update job runs during a major week.</div>`;
      return;
    }
  }
  render();
}

function defaultTab() {
  const ms = state.data?.majors || [];
  const live = ms.find((m) => m.state === "live") || ms.find((m) => m.state === "pre");
  if (live) return live.key;
  const done = ms.filter((m) => m.state === "final");
  return done.length ? done[done.length - 1].key : (ms[0]?.key || "overall");
}

function render() {
  const data = state.data;
  if (!data) return;
  const majors = data.majors || [];
  const keys = majors.map((m) => m.key).concat("overall");
  let tab = location.hash.slice(1);
  if (!keys.includes(tab)) tab = defaultTab();

  $("#year").innerHTML = state.years.length > 1
    ? `<label>Season <select id="yearSel">${state.years.map((y) => `<option ${y === state.year ? "selected" : ""}>${y}</option>`).join("")}</select></label>`
    : `${data.year} season`;
  const sel = $("#yearSel");
  if (sel) sel.onchange = () => { state.year = Number(sel.value); location.hash = ""; load(); };

  $("#tabs").innerHTML = majors.map((m) =>
    `<a href="#${m.key}" ${tab === m.key ? 'aria-current="page"' : ""}>${m.state === "live" ? '<span class="dot" aria-label="Live"></span>' : ""}${esc(tabLabel(m))}</a>`
  ).join("") + `<a href="#overall" ${tab === "overall" ? 'aria-current="page"' : ""}>Overall</a>`;

  $("#main").innerHTML = tab === "overall" ? overallView(data) : majorView(majors.find((m) => m.key === tab), data);
  document.title = `Majors Pool ${data.year}`;
}

function majorView(m, data) {
  if (!m) return "";
  let pill, meta = "";
  if (m.state === "live") { pill = `<span class="pill live"><span class="dot"></span>Live · Round ${m.round}</span>`; }
  else if (m.state === "final") { pill = `<span class="pill final">Final</span>`; }
  else if (m.state === "pre") { pill = `<span class="pill">Field set · starts ${day(m.start)}</span>`; }
  else { pill = `<span class="pill">${m.start ? `${day(m.start)} – ${day(m.end)}` : "Dates to come"}</span>`; }
  if (m.updated) meta = `Updated ${when(m.updated)}${m.state === "live" ? " · checks every 15 minutes" : ""}`;

  if (m.test) pill += ` <span class="pill">Test run · doesn't count</span>`;
  let html = `<section class="head"><h2>${esc(m.name)}</h2>${pill}<span class="meta">${meta}</span></section>`;
  if (m.error) html += `<div class="banner">${esc(m.error)}</div>`;

  if (!m.standings) {
    html += `<div class="empty"><b>${m.start ? `Starts ${day(m.start)}.` : "Not scheduled yet."}</b> Standings appear here once ESPN posts the field, usually the Monday before, along with a check that every golfer in the pool is in it.</div>`;
    return html;
  }

  const ranked = [...m.standings].sort((a, b) => a.rank - b.rank);
  html += `<section><h3>${m.state === "final" ? "Final standings" : "Standings"}</h3><div class="board">` +
    ranked.map((s) => `<div class="place ${s.rank === 1 ? "first" : ""}">
      <span class="rk">${ordinal(s.rank).toUpperCase()}</span>
      <span class="who">${esc(s.person)}</span>
      <span class="tot ${isUnder(s.total) ? "under" : ""}">${esc(s.total)}</span>
      <span class="sub">${s.counting} counting · ${s.usable} of ${s.golfers.length} still in</span>
    </div>`).join("") + `</div></section>`;

  html += `<section><h3>Top 5</h3><div class="teams">` + ranked.map((s) => {
    const top = s.golfers.filter((g) => g.counts).sort((a, b) => scoreNum(a.score) - scoreNum(b.score));
    return `<div class="team"><h4>${esc(s.person)}<span class="${isUnder(s.total) ? "under" : ""}">${esc(s.total)}</span></h4><ol>` +
      (top.length ? top.map((g) => `<li class="counts"><span class="mark"></span>
        <span class="nm">${esc(g.name)}</span>
        <span class="sc ${isUnder(g.score) ? "under" : ""}">${esc(g.score)}</span>
        <span class="st">${esc(statusText(g))}</span></li>`).join("") : `<li><span></span><span class="nm">No golfers left</span></li>`) +
      `</ol></div>`;
  }).join("") + `</div></section>`;

  html += `<section><h3>Teams</h3><div class="teams">` + m.standings.map((s) => `
    <div class="team"><h4>${esc(s.person)}<span>${ordinal(s.rank)}</span></h4><ol>` +
      s.golfers.map((g, i) => `<li class="${g.counts ? "counts" : ""} ${g.out ? "out" : ""} ${i % 4 === 0 && i ? "gap" : ""}">
        <span class="mark">${g.counts ? "●" : ""}</span>
        <span class="nm" title="${esc(g.espn && g.espn !== g.name ? `${g.name} (ESPN: ${g.espn})` : g.name)}">${esc(g.name)}</span>
        <span class="sc ${!g.out && isUnder(g.score) ? "under" : ""}">${g.out ? esc(g.status) : esc(g.score)}</span>
        <span class="st">${esc(statusText(g))}</span>
      </li>`).join("") + `</ol></div>`).join("") +
    `</div><p class="legend">● counts toward the best five. Red is under par.</p></section>`;

  const snaps = Object.fromEntries((m.snapshots || []).map((s) => [s.day, s]));
  html += `<section><h3>End-of-day files</h3><div class="days">` + [1, 2, 3, 4].map((d) => {
    const s = snaps[d];
    if (!s) return `<div class="chip pending"><b>Day ${d}</b><small>${d === 2 ? "Saved when round 2 is done and the cut is posted" : `Saved when round ${d} is done`}</small></div>`;
    const leader = Object.entries(s.ranks).find(([, r]) => r === 1)?.[0];
    return `<a class="chip" href="${encodeURI(s.file)}" download><b>Day ${d}</b><small>${esc(leader)} leads at ${esc(s.totals[leader])} · ${when(s.saved)}</small></a>`;
  }).join("") + `</div></section>`;

  const checks = m.name_check || [];
  if (checks.length) {
    const label = { spelling: "Matched", likely: "Please confirm", dnp: "Not in field", override: "Set by hand" };
    const line = (c) => {
      if (c.kind === "spelling") return `<b>${esc(c.roster)}</b> (${esc(c.person)}) matched to ESPN's <b>${esc(c.espn)}</b>. Same name, different spelling.`;
      if (c.kind === "likely") return `<b>${esc(c.roster)}</b> (${esc(c.person)}) matched to <b>${esc(c.espn)}</b>. If that's wrong, add an override.`;
      if (c.kind === "override") return `<b>${esc(c.roster)}</b> (${esc(c.person)}) ${c.espn ? `set to <b>${esc(c.espn)}</b>` : "set to DNP"} in config.json.`;
      return `<b>${esc(c.roster)}</b> (${esc(c.person)}) isn't in the field, so counts as DNP.${c.suggestion ? ` Closest name: ${esc(c.suggestion)}.` : ""}`;
    };
    const order = { likely: 0, dnp: 1, spelling: 2, override: 3 };
    html += `<section><h3>Name check</h3><div class="checks">` +
      [...checks].sort((a, b) => order[a.kind] - order[b.kind]).map((c) =>
        `<div class="check ${c.kind}"><span class="tag">${label[c.kind]}</span><span>${line(c)}</span></div>`).join("") +
      `</div></section>`;
  }
  return html;
}

function overallView(data) {
  const majors = (data.majors || []).filter((m) => !m.test);
  const rows = data.overall || [];
  const played = majors.filter((m) => m.state === "live" || m.state === "final");
  let html = `<section class="head"><h2>${data.year} Overall</h2><span class="meta">${data.updated ? "Updated " + when(data.updated) : ""}</span></section>`;
  if (!played.length) {
    return html + `<div class="empty"><b>No majors played yet.</b> Each player's finishing position in each major is added up here, and the lowest total wins.</div>`;
  }
  html += `<div class="tablewrap"><table><thead><tr><th class="who">Player</th>` +
    majors.map((m) => `<th>${esc(SHORT[m.key] || m.name)}</th>`).join("") +
    `<th>Total</th><th>Place</th></tr></thead><tbody>` +
    rows.map((r) => `<tr><td class="who">${esc(r.person)}</td>` +
      majors.map((m) => {
        const v = r.ranks[m.key];
        if (v == null) return `<td class="n" style="color:var(--muted)">–</td>`;
        return `<td class="n">${m.state === "live" ? `<span class="lv" title="Live, not final">${v}</span>` : v}</td>`;
      }).join("") +
      `<td class="total">${r.total}</td><td class="place-col">${ordinal(r.place)}</td></tr>`).join("") +
    `</tbody></table></div>`;
  html += `<p class="note">Each major's finishing position, added up. Lowest total wins.` +
    (played.some((m) => m.state === "live") ? ` <span style="color:var(--live);font-style:italic">Red italic</span> is the current position in a major still being played.` : "") + `</p>`;
  return html;
}

window.addEventListener("hashchange", render);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
